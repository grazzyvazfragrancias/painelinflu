<style>
/* Layout: brand manual applied — black ink on the GV pale yellow (#fcffc1), tag-like cards, wide-tracked caps; fragrance pyramid drives gamification */
:root{
  --bg:#fbfcee; --surface:#ffffff; --sunk:#f3f5dc; --line:#e3e5c9;
  --fg:#141412; --muted:#66675a; --accent:#141412; --accent-soft:#fcffc1; --on-accent:#fcffc1;
  --gold:#8a6d12; --gold-soft:#fcffc1; --silver:#6f7278; --bronze:#8d5532;
  --ok:#2f7a55; --ok-soft:#e1f1e8; --warn:#8a5d08; --warn-soft:#f7ecc9; --bad:#a83a3a; --bad-soft:#f6e0e0;
  --display:"Marcellus","Trajan Pro",Georgia,serif;
  --body:"Aileron","Albert Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --side:#fcffc1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f0d; --surface:#181816; --sunk:#202019; --line:#2f3026;
  --fg:#f4f5e6; --muted:#a3a490; --accent:#fcffc1; --accent-soft:#2c2d1d; --on-accent:#141412;
  --gold:#e8d36a; --gold-soft:#2f2c16; --silver:#b8bcc4; --bronze:#d39469;
  --ok:#6cc596; --ok-soft:#1d3428; --warn:#e2b25a; --warn-soft:#3a2f18; --bad:#e58585; --bad-soft:#3d2121; --side:#141410; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
aside{background:var(--side);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-bottom:4px}
.logo{width:84px;height:auto;display:block}
@media (prefers-color-scheme:dark){.logo{filter:invert(1)}}
.wm{font-size:18px;letter-spacing:.14em}
.wm b{font-weight:700}.wm span{font-weight:300}
.brand small,.tag{font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-style:italic;color:var(--muted)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:rgba(127,127,100,.14);border-radius:8px;padding:3px;gap:3px}
.mode button{border:0;background:none;padding:7px 6px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.mode button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
nav button:hover{background:rgba(127,127,100,.12);color:var(--fg)}
nav button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
nav .count{font-family:var(--mono);font-size:11px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:flex-start;overflow-wrap:anywhere}
main{padding-block:24px 48px;padding-left:28px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1240px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;text-transform:uppercase;letter-spacing:.12em}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel > p{margin:0 0 12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.stat.hl{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stat.hl .l{color:inherit;opacity:.8}
.tbl{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--sunk);color:var(--muted)}
.p-acc{background:var(--accent-soft);color:var(--fg);border:1px solid var(--line)}
.coupon{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:2px 7px;border-radius:5px;letter-spacing:.04em}
.mono{font-family:var(--mono)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--fg);border:1px solid var(--fg);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.who small{display:block;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;padding-top:8px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.step .av{width:44px;height:44px;font-size:14px}
.step .nm{font-weight:700;font-size:13px;overflow-wrap:anywhere}
.step .amt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.block{width:100%;border-radius:8px 8px 0 0;display:grid;place-items:center;font-family:var(--display);font-size:30px}
.s1 .block{height:96px;background:var(--accent);color:var(--on-accent)}
.s2 .block{height:70px;background:var(--sunk);color:var(--silver)}
.s3 .block{height:52px;background:var(--sunk);color:var(--bronze)}
.s1 .av{box-shadow:0 0 0 3px var(--fg)}
.level{display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.gold i{background:var(--gold)}
.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px}
.notes span{padding:4px 2px;text-align:center;border-radius:5px;background:var(--sunk);color:var(--muted)}
.notes span.on{background:var(--accent-soft);color:var(--fg);font-weight:700;border:1px solid var(--line)}
.links{display:flex;flex-direction:column;gap:8px}
.link{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.link div{min-width:0;flex:1}
.link code{font-family:var(--mono);font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camp{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.camp h3{font-family:var(--display);font-weight:400;font-size:19px;text-transform:uppercase;letter-spacing:.1em}
.prod{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.prod b{font-weight:600}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-width:0;width:240px;max-width:100%}
select.search{width:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.banner{border:1px dashed var(--fg);background:var(--accent-soft);color:var(--fg);border-radius:var(--r);padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
pre.nf,pre.raw{background:var(--sunk);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
pre.raw{max-height:240px;overflow:auto}
ol.steps{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.cred{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cred dl{margin:0}
.scrim{position:fixed;inset:0;background:rgba(20,20,10,.45);display:flex;justify-content:flex-end;z-index:50}
.sheet{background:var(--bg);width:min(620px,100%);height:100%;overflow:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h2{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;letter-spacing:.1em}
form.f{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;grid-column:span 6;min-width:0}
.fld.h{grid-column:span 3}.fld.t{grid-column:span 2}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-width:0;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.sec{grid-column:span 6;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--fg);padding-top:8px;border-top:1px solid var(--line)}
.lines{grid-column:span 6;display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:6px}
.line.i{grid-template-columns:minmax(0,2fr) 70px minmax(0,1fr) auto}
.line input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;min-width:0}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.chal{display:flex;flex-direction:column;gap:10px}
.chal-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.chal-row .bar{grid-column:span 2}
/* login */
.gate{min-height:100%;display:grid;place-items:center;background:var(--side);padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;gap:18px}
.gate-card .brand{padding-bottom:6px}
.gate-card h1{font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.14em;text-align:center}
.gate-card p{margin:0;color:var(--muted);text-align:center}
.err{color:var(--bad);font-size:13px;min-height:1em}
.gate-card.wide{width:min(480px,100%)}
.gate-card a{color:var(--fg);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--fg)}
.check input{margin-top:3px;width:auto}
.hint{font-size:12px;min-height:1em}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--bad)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.queue td{background:var(--accent-soft)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{flex-direction:row;justify-content:center;gap:12px}
  .brand .logo{width:46px}
  .brand small{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav button{white-space:nowrap;gap:6px}
  .side-foot{flex-direction:row;align-items:center;justify-content:space-between;margin-top:0}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .fld.h,.fld.t{grid-column:span 6}
  .line.i{grid-template-columns:minmax(0,1fr) 60px 90px auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = () => isoLocal(new Date());
const dBR = s => s ? String(s).slice(0,10).split("-").reverse().join("/") : "—";
const dtBR = s => { if(!s) return "—"; const d=new Date(s); return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); };
const addDays = (s,n) => { const d=new Date(String(s).slice(0,10)+"T12:00:00"); d.setDate(d.getDate()+n); return isoLocal(d); };
const ini = n => (n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const ped = n => `${n} ${Number(n)===1?"pedido":"pedidos"}`;
const firstName = n => { const p=(n||"").trim().split(/\s+/); return p.length>1 ? p[0]+" "+p[p.length-1][0]+"." : (p[0]||"Cliente"); };
const LEVELS = ["Notas de Saída","Notas de Coração","Notas de Fundo","Assinatura"];
const DEF_CFG = { releaseDays:15, storeUF:"MG", storeUrl:"https://www.grazzyvazfragrancias.com.br", tiers:[0,2000,6000,15000], commissionBase:"produtos", signupOpen:true, defaultRate:10, defaultDiscount:10 };
const S = { inf:[], sales:[], pay:[], cred:[], camp:[], chal:[], ship:[], cfg:{}, log:[], rank:{} };
const ME = { admin:false, infId:null, email:"" };
let sb = null, mode = "admin", view = "overview", asInf = null, period = "month", q = "";
const rankLoading = new Set();

function toast(m){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
const brandHTML = `<div class="brand"><img class="logo" src="${LOGO}" alt="Grazzy Vaz" width="240" height="186"><div class="wm"><b>Grazzy</b> <span>Vaz</span></div><small>Clube de influenciadoras</small></div>`;

/* ---------------- números ---------------- */
const cfg = () => ({...DEF_CFG, ...S.cfg});
const infById = id => S.inf.find(i=>i.id===id);
function periodRange(p){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  if(p==="month") return [isoLocal(new Date(y,m,1)), isoLocal(new Date(y,m+1,0))];
  if(p==="last") return [isoLocal(new Date(y,m-1,1)), isoLocal(new Date(y,m,0))];
  if(p==="90") return [addDays(today(),-90), today()];
  return ["2000-01-01","2100-12-31"];
}
function inPeriod(date,p){ const [a,b]=periodRange(p); return !!date && date>=a && date<=b; }
const salesOf = id => S.sales.filter(s=>s.infId===id);
const rateOf = s => Number(s.rate ?? infById(s.infId)?.rate ?? 10);
const baseOf = s => cfg().commissionBase==="total" ? (Number(s.total)||0) : (Number(s.base ?? s.total)||0);
const comm = s => s.status==="aprovado" ? baseOf(s)*rateOf(s)/100 : 0;
// o prazo conta a partir do dia em que o pedido ficou pago
const relDate = s => addDays(s.paid_at||s.date||today(), cfg().releaseDays);
const released = s => s.status==="aprovado" && relDate(s) <= today();
function wallet(id){
  let earned=0, rel=0;
  salesOf(id).forEach(s=>{ const c=comm(s); earned+=c; if(released(s)) rel+=c; });
  const bonus=S.cred.filter(c=>c.infId===id).reduce((a,c)=>a+(Number(c.amount)||0),0);
  const paid=S.pay.filter(p=>p.infId===id).reduce((a,p)=>a+(Number(p.amount)||0),0);
  return { pending:earned-rel, bonus, paid, available:Math.max(0,rel+bonus-paid) };
}
function stats(id,p){
  const ss=salesOf(id).filter(s=>s.status==="aprovado" && inPeriod(s.date,p));
  return { orders:ss.length, total:ss.reduce((a,s)=>a+(Number(s.total)||0),0), comm:ss.reduce((a,s)=>a+comm(s),0) };
}
function ranking(p){
  return S.inf.filter(i=>i.status==="ativa").map(i=>({i, ...stats(i.id,p)})).sort((a,b)=>b.total-a.total || b.orders-a.orders);
}
// Ranking para a tela da influenciadora: admin calcula aqui; influenciadora busca no servidor
function rankingFor(p){
  if(ME.admin) return ranking(p).filter(x=>x.orders>0);
  if(S.rank[p]) return S.rank[p];
  if(!rankLoading.has(p)){
    rankLoading.add(p);
    const [a,b]=periodRange(p);
    sb.rpc("ranking",{p_inicio:a,p_fim:b}).then(({data,error})=>{
      rankLoading.delete(p);
      if(error){ toast("Não foi possível carregar o ranking."); S.rank[p]=[]; }
      else S.rank[p]=(data||[]).map(r=>({i:{id:r.influencer_id,name:r.name}, orders:Number(r.orders), total:r.total==null?null:Number(r.total)}));
      render();
    });
  }
  return null;
}
function level(id){
  const t=cfg().tiers, total=stats(id,"all").total; let k=0;
  t.forEach((v,ix)=>{ if(total>=v) k=ix; });
  const next=t[k+1]; return { k, name:LEVELS[k], total, next, pct: next? Math.min(100,(total-t[k])/(next-t[k])*100):100 };
}
function chalProgress(c,id){
  const ss=salesOf(id).filter(s=>s.status==="aprovado" && s.date>=c.start && s.date<=c.end);
  const v = c.metric==="pedidos" ? ss.length : ss.reduce((a,s)=>a+(Number(s.total)||0),0);
  return { v, pct: Math.min(100, v/(Number(c.target)||1)*100), done: v>=(Number(c.target)||Infinity) };
}
const activeCamps = () => S.camp.filter(c=>c.active!==false && (!c.end || c.end>=today()) && (!c.start || c.start<=today()));
const activeChals = () => S.chal.filter(c=>c.end>=today());

/* ---------------- dados (Supabase) ---------------- */
const TABLES = { inf:"influencers", sales:"sales", pay:"payouts", cred:"credits", camp:"campaigns", chal:"challenges", ship:"shipments" };
const REN = { infId:"influencer_id", order:"order_number", chalId:"challenge_id", start:"start_date", end:"end_date" };
const REV = Object.fromEntries(Object.entries(REN).map(([a,b])=>[b,a]));
const toRow = o => Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined).map(([k,v])=>[REN[k]||k, v===""?null:v]));
const fromRow = r => Object.fromEntries(Object.entries(r).map(([k,v])=>[REV[k]||k, v]));
const SALE_COLS = "id,external_id,bagy_id,order_number,date,customer,coupon,total,base,status,paid_at,rate,manual_override,influencer_id,source,created_at";

async function fetchAll(build){
  let out=[], from=0;
  for(;;){
    const {data,error}=await build().range(from, from+999);
    if(error) throw error;
    out=out.concat(data||[]);
    if(!data || data.length<1000) break;
    from+=1000;
  }
  return out;
}
async function loadKey(key){
  let rows;
  if(key==="sales"){
    rows = ME.admin
      ? await fetchAll(()=>sb.from("sales").select(SALE_COLS).order("date",{ascending:false}).order("id"))
      : await fetchAll(()=>sb.from("minhas_vendas").select("*").order("date",{ascending:false}).order("id"));
  } else {
    rows = await fetchAll(()=>sb.from(TABLES[key]).select("*").order("created_at",{ascending:false}).order("id"));
  }
  S[key]=rows.map(fromRow);
}
async function loadCfg(){
  const {data,error}=await sb.from("settings").select("*").eq("id",1).maybeSingle();
  if(error) throw error;
  if(data) S.cfg={ releaseDays:Number(data.release_days), storeUF:data.store_uf, storeUrl:data.store_url, tiers:(data.tiers||[]).map(Number), commissionBase:data.commission_base, signupOpen:data.signup_open!==false, defaultRate:Number(data.default_rate??10), defaultDiscount:Number(data.default_discount??10) };
}
async function loadLog(){
  if(!ME.admin) return;
  const [{data}, {data:k}]=await Promise.all([
    sb.from("bagy_log").select("*").order("at",{ascending:false}).limit(30),
    sb.from("integration").select("webhook_key").eq("id",1).maybeSingle()
  ]);
  S.log=data||[]; S.hookKey=k?.webhook_key||"";
}
async function loadAll(){
  await Promise.all([...Object.keys(TABLES).map(loadKey), loadCfg(), loadLog()]);
  S.rank={};
}
function friendly(e){
  const m=String(e?.message||e||"");
  if(e?.code==="23505"||/duplicate key/i.test(m)) return /coupon/i.test(m)?"Esse cupom já pertence a outra influenciadora.":/email/i.test(m)?"Esse e-mail já está em outro cadastro.":/credits/i.test(m)?"Esse bônus já foi creditado.":"Esse registro já existe.";
  if(/row-level security|permission denied/i.test(m)) return "Você não tem permissão para fazer isso.";
  if(/JWT|session|token/i.test(m)) return "Sua sessão expirou. Entre de novo.";
  if(/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Confira sua internet.";
  return "Não foi possível salvar: "+m;
}
async function save(key, id, data){
  const row=toRow(data); if(id) row.id=id;
  delete row.created_at;
  const {error}=await sb.from(TABLES[key]).upsert(row);
  if(error){ toast(friendly(error)); return false; }
  try{ await loadKey(key); if(key==="inf") await loadKey("sales"); S.rank={}; }catch(e){ toast(friendly(e)); }
  render(); return true;
}
async function del(key,id){
  const {error}=await sb.from(TABLES[key]).delete().eq("id",id);
  if(error){ toast(friendly(error)); return false; }
  await loadKey(key); S.rank={}; render(); return true;
}
const strip = o => { const {id, created_at, ...rest} = o; return rest; };
async function callAdmin(body){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ throw new Error("Sua sessão expirou. Entre de novo."); }
  let r;
  try{
    r=await fetch(`${SUPABASE_URL}/functions/v1/painel/admin`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${session.access_token}`,apikey:SUPABASE_KEY},body:JSON.stringify(body)});
  }catch(_){ throw new Error("Não consegui falar com a função do servidor. Confira se a função “painel” foi publicada."); }
  const j=await r.json().catch(()=>({error:`O servidor respondeu ${r.status}. Confira se a função “painel” foi publicada.`}));
  if(!r.ok||j.error) throw new Error(j.error||`Erro ${r.status}`);
  return j;
}

async function fnPublic(path, opts={}){
  try{
    const r=await fetch(`${SUPABASE_URL}/functions/v1/painel/${path}`,{...opts,headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY}});
    const j=await r.json().catch(()=>({error:"Resposta inválida do servidor."}));
    return { ok:r.ok && !j.error, ...j };
  }catch(_){ return { ok:false, error:"Sem conexão com o servidor. Confira sua internet." }; }
}

let started=false, salesChannel=null;
async function start(){
  const {data:{session}}=await sb.auth.getSession();

  ME.email=session.user.email||"";
  gate(`<p>Carregando seu painel…</p>`);
  const {data,error}=await sb.rpc("whoami");

  ME.admin=!!data?.admin; ME.infId=data?.influencer_id||null;

    gate(`<h1>Cadastro em análise</h1><p>Oi, ${esc(String(data.pending.name||"").split(" ")[0])}! Recebemos seu cadastro. Assim que a equipe Grazzy Vaz aprovar, seu cupom <span class="coupon">${esc(data.pending.coupon)}</span> é ativado na loja e o seu painel abre aqui, com este mesmo e-mail e senha.</p><div class="row" style="justify-content:center"><button class="btn pri" id="again">Ver se já fui aprovada</button><button class="btn" id="out">Sair</button></div>`);

  }
  if(!ME.admin && !ME.infId){
    gate(`<h1>Acesso pendente</h1><p>O e-mail ${esc(ME.email)} ainda não está ligado a um cadastro ativo do clube. Fale com a equipe Grazzy Vaz.</p><button class="btn" id="out">Sair</button>`);
    $("#out").onclick=()=>sb.auth.signOut(); return;

  mode = ME.admin ? "admin" : "inf"; view = ME.admin ? "overview" : "me"; asInf = ME.infId;
  renderShell(); render(); started=true;
  if(ME.admin && !salesChannel){
    let t=null;
    salesChannel=sb.channel("vendas").on("postgres_changes",{event:"*",schema:"public",table:"sales"},payload=>{

    }).subscribe();
  }
}

function podium(p, highlight){
  const all=rankingFor(p);
  if(all===null) return `<div class="empty">Carregando ranking…</div>`;
  const r=all.filter(x=>x.orders>0);
  if(!r.length) return `<div class="empty">Ainda não há vendas neste período.</div>`;
  const showTotal = x => (mode==="admin" || x.i.id===highlight) && x.total!=null;
  const slot=(x,n)=> x? `<div class="step s${n}"><div class="av">${esc(ini(x.i.name))}</div><div class="nm">${esc(x.i.name)}${x.i.id===highlight?" (você)":""}</div><div class="amt">${showTotal(x)? brl(x.total): ped(x.orders)}</div><div class="block">${n}º</div></div>` : `<div class="step s${n}"><div class="block">${n}º</div></div>`;
  return `<div class="podium">${slot(r[1],2)}${slot(r[0],1)}${slot(r[2],3)}</div>`;
}

  return `<div class="tbl"><table><thead><tr><th>Quando</th><th>Evento</th><th>Pedido</th><th>Resultado</th><th>Detalhe</th></tr></thead><tbody>${S.log.map(l=>`<tr><td>${dtBR(l.at)}</td><td class="muted">${esc(l.event)}</td><td class="mono">${esc(l.order_ref||"—")}</td><td><span class="pill ${pill(l.result||"")}">${esc(l.result)}</span></td><td class="muted">${esc(l.detail||"")}</td></tr>`).join("")}</tbody></table></div>`;

    const row={ release_days:+$("#c-rd").value||0, commission_base:$("#c-base").value, store_uf:$("#c-uf").value.toUpperCase(), store_url:$("#c-url").value.trim(), tiers:[0,+$("#c-t1").value||0,+$("#c-t2").value||0,+$("#c-t3").value||0], signup_open:$("#c-open").value==="1", default_discount:+$("#c-ddisc").value||0, default_rate:+$("#c-drate").value||0, updated_at:new Date().toISOString() };

/* ---------------- telas da influenciadora ---------------- */
const meOr = () => infById(asInf);
const noInf = `<div class="panel empty">Cadastre uma influenciadora para ver o painel dela.</div>`;
const preview = i => ME.admin ? `<div class="banner"><span>Pré-visualização: é assim que <b>${esc(i.name)}</b> vê o painel dela.</span></div>` : "";
VIEWS.me = () => {
  const i=meOr(); if(!i) return noInf;
  const w=wallet(i.id), st=stats(i.id,"month"), l=level(i.id), r=rankingFor("month");
  const pos=r? r.findIndex(x=>x.i.id===i.id)+1 : 0;
  const recent=salesOf(i.id).sort(sortDate).slice(0,5);
  return `${preview(i)}
  <div class="head"><div><div class="eyebrow">Olá, ${esc(i.name.split(" ")[0])}</div><h1>Seu painel</h1><p>Cupom <span class="coupon">${esc(i.coupon)}</span> · comissão de ${Number(i.rate)}% por venda</p></div></div>
  <div class="stats">
    <div class="stat hl"><span class="l">Disponível para saque</span><span class="v">${brl(w.available)}</span></div>
    <div class="stat"><span class="l">A liberar</span><span class="v">${brl(w.pending)}</span></div>
    <div class="stat"><span class="l">Vendas no mês</span><span class="v">${brl(st.total)}</span></div>
    <div class="stat"><span class="l">Posição no ranking do mês</span><span class="v">${pos&&st.orders?pos+"º":"—"}</span></div>
  </div>
  <div class="grid g2">
    <div class="panel"><h2>Seu nível</h2><div class="level"><div class="row" style="justify-content:space-between"><b style="font-family:var(--display);font-size:24px;font-weight:400">${l.name}</b><span class="muted">${brl(l.total)} vendidos</span></div>
      <div class="bar"><i style="width:${l.pct}%"></i></div><div class="muted" style="font-size:12px">${l.next?`Faltam ${brl(l.next-l.total)} para ${LEVELS[l.k+1]}`:"Você chegou ao topo da pirâmide."}</div>
      <div class="notes">${LEVELS.map((n,ix)=>`<span class="${ix<=l.k?"on":""}">${n.replace("Notas de ","")}</span>`).join("")}</div></div></div>
    <div class="panel"><h2>Pódio do mês</h2>${podium("month",i.id)}</div>
  </div>
  <div class="grid g2">
    <div class="panel"><h2>Desafios para você</h2>${myChals(i)}</div>
    <div class="panel"><h2>Últimas compras com seu cupom <button class="btn sm ghost" data-go="mysales">Ver todas</button></h2>${salesTable(recent,{privacy:true,empty:"Nenhuma compra com seu cupom ainda."})}</div>
  </div>`;
};
function myChals(i){
  const cs=activeChals(); if(!cs.length) return `<div class="empty">Nenhum desafio ativo agora.</div>`;
  return `<div class="chal">${cs.map(c=>{ const p=chalProgress(c,i.id); return `<div class="chal-row"><div><b>${esc(c.title)}</b><div class="muted" style="font-size:12px">${c.metric==="pedidos"?p.v+" de "+c.target+" pedidos":brl(p.v)+" de "+brl(c.target)} · até ${dBR(c.end)} · prêmio: ${esc(c.reward)}</div></div><div>${p.done?`<span class="pill p-ok">Meta batida</span>`:""}</div><div class="bar ${p.done?"gold":""}"><i style="width:${p.pct}%"></i></div></div>`; }).join("")}</div>`;
}

  return `${preview(i)}<div class="head"><div><div class="eyebrow">${esc(i.name)}</div><h1>Quem usou meu cupom</h1><p>Por privacidade, você vê o primeiro nome e a inicial de cada cliente.</p></div>${periodSel()}</div><div class="panel">${salesTable(list,{privacy:true,empty:"Nenhuma compra com seu cupom neste período."})}</div>`; };

VIEWS.mycamp = () => { const i=meOr(); const cs=activeCamps(); return `${i?preview(i):""}<div class="head"><div><div class="eyebrow">Campanhas</div><h1>Produtos em campanha</h1><p>O que a marca quer destacar agora, com briefing e link pronto.</p></div></div>${cs.length?`<div class="grid g3">${cs.map(c=>campCard(c,false)).join("")}</div>`:`<div class="panel empty">Nenhuma campanha no ar agora.</div>`}`; };
VIEWS.myrank = () => { const i=meOr(); if(!i) return noInf; const all=rankingFor(period);

  return `${preview(i)}<div class="head"><div><div class="eyebrow">Ranking</div><h1>Quem está brilhando</h1><p>${all===null?"Carregando…":pos?`Você está em ${pos}º lugar.`:"Faça sua primeira venda no período para entrar no ranking."}</p></div>${periodSel()}</div>
  <div class="panel">${podium(period,i.id)}</div>

VIEWS.myship = () => { const i=meOr(); if(!i) return noInf; const list=S.ship.filter(s=>s.infId===i.id).sort(sortDate);
  return `${preview(i)}<div class="head"><div><div class="eyebrow">${esc(i.name)}</div><h1>Meus envios</h1><p>Produtos que a marca enviou para você divulgar.</p></div></div>
  <div class="panel">${list.length?`<div class="tbl"><table><thead><tr><th>Data</th><th>Produtos</th><th>Rastreio</th><th>Status</th></tr></thead><tbody>${list.map(s=>`<tr><td>${dBR(s.date)}</td><td>${(s.items||[]).map(it=>`${Number(it.qty)}× ${esc(it.name)}`).join("<br>")}</td><td>${s.tracking?`<a href="https://rastreamento.correios.com.br/app/index.php?objeto=${encodeURIComponent(s.tracking)}" target="_blank" rel="noopener" class="mono">${esc(s.tracking)}</a>`:"—"}</td><td>${shipPill(s)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nenhum envio ainda.</div>`}

AFTER.mydata = () => {
  if(ME.admin) return;

  $("#md-f").onsubmit=async e=>{ e.preventDefault();
    const p={ handle:val("md-handle"), phone:val("md-phone"), pix:val("md-pix"), cpf:val("md-cpf"), cep:val("md-cep"), street:val("md-street"), number:val("md-number"), complement:val("md-compl"), district:val("md-district"), city:val("md-city"), state:val("md-state").toUpperCase() };

/* ---------------- formulários ---------------- */
function sheet(title, body, onMount){
  $("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h2>${esc(title)}</h2><button class="btn sm" id="close" type="button">Fechar</button></div>${body}</div></div>`;
  $("#close").onclick=closeSheet; $("#scrim").onclick=e=>{ if(e.target.id==="scrim") closeSheet(); };
  onMount && onMount();
}
function closeSheet(){ $("#layer").innerHTML=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
const fld = (id,label,v="",cls="",type="text",extra="") => `<div class="fld ${cls}"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(v??"")}" ${extra}></div>`;
const val = id => ($("#"+id)?.value ?? "").trim();
function confirmIn(sel,msg,fn){ const z=$(sel); z.innerHTML=`<span class="row"><span>${msg}</span><button type="button" class="btn danger" id="cy">Sim</button><button type="button" class="btn" id="cn">Não</button></span>`; $("#cy").onclick=fn; $("#cn").onclick=()=>{ z.innerHTML=""; }; }
function cepFill(p){
  const el=$("#"+p+"-cep"); if(!el) return;
  el.addEventListener("blur", async ()=>{ const cep=el.value.replace(/\D/g,""); if(cep.length!==8 || val(p+"-street")) return;
    try{ const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`); const d=await r.json(); if(d.erro) return;
      $("#"+p+"-street").value=d.logradouro||""; $("#"+p+"-district").value=d.bairro||""; $("#"+p+"-city").value=d.localidade||""; $("#"+p+"-state").value=d.uf||""; $("#"+p+"-number").focus(); }catch(_){ /* busca de CEP é opcional */ } });
}
const linkLine = l => `<div class="line"><input placeholder="Nome do link" value="${esc(l.label||"")}" aria-label="Nome do link"><input placeholder="https://" value="${esc(l.url||"")}" aria-label="Endereço"><button type="button" class="btn sm ghost" data-rm>Remover</button></div>`;
function infForm(i={}){
  const links=(i.links||[]);
  sheet(i.id?"Editar influenciadora":"Nova influenciadora", `<form class="f" id="f">
    <div class="sec">Perfil</div>
    ${fld("i-name","Nome completo",i.name,"h","text","required")}${fld("i-handle","Instagram / TikTok",i.handle,"h","text",'placeholder="@perfil"')}
    ${fld("i-email","E-mail (é o login dela no painel)",i.email,"h","email","required")}${fld("i-phone","WhatsApp",i.phone,"h","tel")}
    <div class="sec">Cupom e comissão</div>
    ${fld("i-coupon","Cupom (igual ao da Bagy)",i.coupon,"t","text",'required style="text-transform:uppercase"')}${fld("i-rate","Comissão (%)",i.rate??cfg().defaultRate,"t","number",'min="0" max="100" step="0.5"')}${fld("i-discount","Desconto das seguidoras (%)",i.discount??cfg().defaultDiscount,"t","number",'min="0" max="100" step="0.5"')}
    <div class="fld h"><label for="i-status">Status</label><select id="i-status">${i.status==="pendente"?`<option value="pendente" selected>Aguardando aprovação</option>`:""}<option value="ativa" ${i.status==="ativa"||!i.status?"selected":""}>Ativa</option><option value="inativa" ${i.status==="inativa"?"selected":""}>Inativa (perde o acesso)</option></select></div>
    ${fld("i-pix","Chave PIX",i.pix,"")}
    <div class="sec">Dados para NF e envio</div>
    ${fld("i-cpf","CPF",i.cpf,"h","text",'inputmode="numeric" placeholder="000.000.000-00"')}${fld("i-cep","CEP",i.cep,"h","text",'inputmode="numeric" placeholder="00000-000"')}
    ${fld("i-street","Rua / Avenida",i.street,"")}
    ${fld("i-number","Número",i.number,"t")}${fld("i-compl","Complemento",i.complement,"t")}${fld("i-district","Bairro",i.district,"t")}
    ${fld("i-city","Cidade",i.city,"h")}${fld("i-state","UF",i.state,"h","text",'maxlength="2" style="text-transform:uppercase"')}
    <div class="sec">Links exclusivos</div>
    <div class="lines" id="links">${(links.length?links:[{label:"",url:""}]).map(linkLine).join("")}</div>
    <div class="fld"><button type="button" class="btn sm" id="add-link">Adicionar link</button></div>
    <div class="fld"><label for="i-notes">Observações internas (ela não vê)</label><textarea id="i-notes">${esc(i.notes||"")}</textarea></div>
    <div class="fld"><div class="row"><button class="btn pri" type="submit" id="i-save">Salvar</button>${i.id?`<span id="dz"><button type="button" class="btn danger" id="del">Excluir</button></span>`:""}</div></div>
  </form>`, ()=>{
    $("#add-link").onclick=()=>$("#links").insertAdjacentHTML("beforeend",linkLine({}));
    $("#links").onclick=e=>{ if(e.target.dataset.rm!==undefined) e.target.closest(".line").remove(); };
    cepFill("i");
    if(i.id) $("#del").onclick=()=>confirmIn("#dz","Excluir esta influenciadora? Pagamentos e envios dela também serão apagados.",async()=>{ if(await del("inf",i.id)){ closeSheet(); toast("Influenciadora excluída"); } });
    $("#f").onsubmit=async e=>{ e.preventDefault(); $("#i-save").disabled=true;
      const data={ ...strip(i), name:val("i-name"), handle:val("i-handle"), email:val("i-email").toLowerCase(), phone:val("i-phone"), coupon:val("i-coupon").toUpperCase(), rate:+val("i-rate")||0, discount:+val("i-discount")||0, status:val("i-status"), pix:val("i-pix"),
        cpf:val("i-cpf"), cep:val("i-cep"), street:val("i-street"), number:val("i-number"), complement:val("i-compl"), district:val("i-district"), city:val("i-city"), state:val("i-state").toUpperCase(),
        links:[...document.querySelectorAll("#links .line")].map(l=>({label:l.children[0].value.trim(),url:l.children[1].value.trim()})).filter(l=>l.url), notes:val("i-notes") };
      if(await save("inf",i.id,data)){ closeSheet(); toast("Cadastro salvo"); } else $("#i-save").disabled=false;
    };
  });
}
function accessBox(r, i){
  const url=location.origin+location.pathname;
  const msg=`Oi, ${i.name.split(" ")[0]}! Seu acesso ao Clube de Influenciadoras Grazzy Vaz está pronto.\n\nEntre em: ${url}\nE-mail: ${r.email}\nSenha: ${r.password}\n\nNo painel você vê quem usou seu cupom, sua carteira, seus links e as campanhas. Troque a senha em Meus dados.`;
  return `<div class="cred"><b>${r.created?"Acesso criado":"Nova senha gerada"}</b><dl class="kv"><dt>Endereço</dt><dd class="mono">${esc(url)}</dd><dt>E-mail</dt><dd class="mono">${esc(r.email)}</dd><dt>Senha</dt><dd class="mono">${esc(r.password)}</dd></dl>
  <div class="row"><button class="btn sm pri" data-copy="${esc(msg)}">Copiar mensagem para WhatsApp</button></div><span class="muted" style="font-size:12px">Esta senha não aparece de novo. Se ela perder, gere outra aqui.</span></div>`;
}
function infDetail(id){
  const i=infById(id); if(!i) return; const w=wallet(id), l=level(id);
  const pending=i.status==="pendente";
  sheet(i.name, `<div class="row"><span class="coupon">${esc(i.coupon)}</span>${pending?"":`<span class="pill p-acc">${l.name}</span>`}${statusPill(i)}<span class="muted">${esc(i.handle||"")}</span></div>
  ${pending?`<div class="banner"><span>Cadastro feito pelo link. Ela já tem login e vê a tela "em análise". Ao aprovar, o cupom <b>${esc(i.coupon)}</b> é criado na Bagy com ${Number(i.discount??10)}% de desconto.</span></div>
  <div class="row"><button class="btn pri" id="d-approve">Aprovar e criar cupom na Bagy</button><button class="btn" id="d-approve-nc">Aprovar sem criar cupom</button><span id="rz"><button class="btn danger" id="d-reject">Recusar</button></span><button class="btn ghost" id="d-edit-p">Editar cadastro</button></div>`:""}
  <div class="row" ${pending?"hidden":""}><button class="btn pri" id="d-edit">Editar cadastro</button>${i.bagy_discount_id?"":`<button class="btn" id="d-coupon">Criar cupom na Bagy</button>`}<button class="btn" id="d-access">Criar acesso / nova senha</button><button class="btn" id="d-pay">Registrar pagamento</button><button class="btn" id="d-ship">Novo envio</button><button class="btn" id="d-exp">Exportar CSV</button><button class="btn ghost" id="d-view">Ver como ela</button></div>
  <div id="access-out"></div>

/* ---------------- importar CSV ---------------- */
function parseCSV(text){
  const first=text.split("\n")[0];
  const sep = (first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length ? ";" : ",";
  const rows=[]; let row=[], cur="", inQ=false;
  for(let k=0;k<text.length;k++){ const ch=text[k];
    if(inQ){ if(ch==='"'){ if(text[k+1]==='"'){cur+='"';k++;} else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true; else if(ch===sep){ row.push(cur); cur=""; } else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(ch!=="\r") cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
const money = v => { let s=String(v||"").replace(/[^\d,.-]/g,""); if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); return +s||0; };
const pdate = v => { const s=String(v||"").trim(); let m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m) return `${m[3]}-${m[2]}-${m[1]}`; m=s.match(/(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:null; };
function importSheet(){
  sheet("Importar pedidos (CSV)", `<p class="muted" style="margin:0">Use se precisar trazer pedidos por planilha. Exporte o relatório de pedidos da Bagy em CSV (com a coluna de cupom) e escolha o arquivo. Pedidos já registrados são atualizados, sem duplicar.</p>
  <div class="fld"><label for="csv">Arquivo CSV</label><input id="csv" type="file" accept=".csv,text/csv"></div><div id="map"></div>`, ()=>{
    $("#csv").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; let text=await f.text(); if(text.includes(String.fromCharCode(0xFFFD))) text=new TextDecoder("iso-8859-1").decode(await f.arrayBuffer());
      const rows=parseCSV(text); if(rows.length<2){ $("#map").innerHTML=`<p class="muted">Não encontrei linhas no arquivo.</p>`; return; }
      const head=rows[0].map(h=>h.trim()); const guess=re=>head.findIndex(h=>re.test(h.toLowerCase()));
      const fields=[["order","Nº do pedido",/pedido|n[uú]mero|order|c[oó]digo/],["date","Data",/data|date/],["customer","Cliente",/cliente|nome|comprador/],["coupon","Cupom",/cupom|coupon/],["total","Valor total",/total/],["base","Valor dos produtos, sem frete (opcional)",/subtotal|produtos/],["status","Status do pagamento",/status|situa|pagamento/]];
      $("#map").innerHTML=`<form class="f" id="mf"><div class="sec">Confira as colunas</div>${fields.map(([k,l,re])=>`<div class="fld h"><label for="mp-${k}">${l}</label><select id="mp-${k}"><option value="-1">(não usar)</option>${head.map((h,ix)=>`<option value="${ix}" ${guess(re)===ix?"selected":""}>${esc(h)}</option>`).join("")}</select></div>`).join("")}
      <div class="fld"><span class="muted" id="prev">${rows.length-1} linhas no arquivo.</span></div><div class="fld"><div class="row"><button class="btn pri" type="submit" id="go">Importar</button></div></div></form>`;
      $("#mf").onsubmit=async ev=>{ ev.preventDefault(); const ix=Object.fromEntries(fields.map(([k])=>[k,+$("#mp-"+k).value])); const get=(r,k)=>ix[k]>=0?(r[ix[k]]||"").trim():"";
        for(const k of ["order","date","coupon","total","status"]) if(ix[k]<0){ $("#prev").textContent=`Escolha a coluna de ${fields.find(f=>f[0]===k)[1].toLowerCase()}.`; return; }
        let skipped=0;
        const list=rows.slice(1).map(r=>{ const st=get(r,"status").toLowerCase(); const order=get(r,"order").replace(/^#/,"").replace(/\s+/g,""); const date=pdate(get(r,"date"));
          if(!date){ skipped++; return null; }
          const row={ external_id:"bagy-"+order, order_number:order, date, customer:get(r,"customer")||null, coupon:get(r,"coupon").toUpperCase(), total:money(get(r,"total")),
            status:/cancel|devol|estorn|reemb|negad|expir|recus/.test(st)?"cancelado":/pago|aprovad|paid|approved|autoriz|faturad|enviad|entregue|conclu|finaliz/.test(st)?"aprovado":"pendente", source:"csv" };
          if(ix.base>=0) row.base=money(get(r,"base"));
          return row; })
          .filter(s=>s && s.coupon && s.order_number);
        if(!list.length){ $("#prev").textContent="Nenhuma linha com cupom, número de pedido e data válida."; return; }
        $("#go").disabled=true; let n=0;
        for(let k=0;k<list.length;k+=200){ const chunk=list.slice(k,k+200);
          const {error}=await sb.from("sales").upsert(chunk,{onConflict:"external_id"});
          if(error){ toast(friendly(error)); $("#go").disabled=false; return; }
          n+=chunk.length; $("#prev").textContent=`Importando… ${n} de ${list.length}`; }
        await loadKey("sales"); S.rank={}; render(); closeSheet();
        const own=S.sales.filter(s=>list.some(x=>x.external_id===s.external_id) && s.infId).length;
        toast(`${n} pedidos com cupom importados · ${own} de influenciadoras cadastradas${skipped?` · ${skipped} linhas sem data válida ignoradas`:""}`); };
    };
  });
}

/* ---------------- exportar ---------------- */
const csvCell = v => { let s=String(v??""); if(typeof v==="string" && /^[=+@\t\r]|^-[^\d]/.test(s)) s="'"+s; return /[";\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
const num = n => (Number(n)||0).toFixed(2).replace(".",",");
function saveFile(name, rows){
  const text=String.fromCharCode(0xFEFF)+rows.map(r=>r.map(csvCell).join(";")).join("\r\n");
  const url=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000); toast("Arquivo baixado");
}
const plabel = () => ({month:"mes-atual",last:"mes-passado","90":"90-dias",all:"total"})[period];
const stLabel = s => ({aprovado:"Paga",pendente:"Aguardando pagamento",cancelado:"Cancelada"})[s]||s;

  ...ranking(period).map((x,ix)=>{ const w=wallet(x.i.id); return [ix+1,x.i.name,x.i.coupon,x.orders,num(x.total),num(x.comm),num(w.pending),num(w.available),num(w.paid),x.i.pix,level(x.i.id).name]; })]); }
function exportSales(){ saveFile(`vendas-cupom-${plabel()}.csv`, [["Data","Pedido","Cliente","Cupom","Influenciadora","Valor (R$)","Comissão (R$)","Status"],
  ...S.sales.filter(s=>inPeriod(s.date,period)).sort(sortDate).map(s=>[dBR(s.date),s.order,s.customer,s.coupon,infById(s.infId)?.name||"",num(s.total),num(comm(s)),stLabel(s.status)])]); }
function exportOne(id){ const i=infById(id); saveFile(`${(i.coupon||"influenciadora").toLowerCase()}-vendas.csv`, [["Data","Pedido","Cliente","Valor (R$)","Comissão (R$)","Status","Liberação"],
  ...salesOf(id).sort(sortDate).map(s=>[dBR(s.date),s.order,s.customer,num(s.total),num(comm(s)),stLabel(s.status),s.status==="aprovado"?dBR(relDate(s)):""])]); }
function exportNF(s){ const i=infById(s.infId)||{}; const same=(i.state||"").toUpperCase()===String(cfg().storeUF).toUpperCase();
  saveFile(`nf-remessa-${(i.coupon||"envio").toLowerCase()}-${s.date}.csv`, [["Destinatária","CPF","E-mail","Telefone","CEP","Rua","Número","Complemento","Bairro","Cidade","UF","Produto","Qtd","Valor unitário","Valor total","CFOP sugerido","Natureza da operação"],
  ...(s.items||[]).map(it=>[i.name,i.cpf,i.email,i.phone,i.cep,i.street,i.number,i.complement,i.district,i.city,i.state,it.name,it.qty,num(it.value),num(it.qty*it.value),same?"5.910":"6.910","Remessa em bonificação, doação ou brinde"])]); }

async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("Copiado"); }catch(_){ toast("Não consegui copiar. Selecione o texto e copie manualmente."); } }

/* ---------------- cliques ---------------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-approve],[data-inf],[data-sale],[data-ship],[data-camp],[data-chal],[data-go],[data-payinf],[data-credit],[data-delhist],[data-exp1],[data-copy],#new-inf,#new-sale,#import,#new-pay,#new-camp,#new-chal,#new-ship,#exp-all,#exp-sales");
  if(!t) return;
  const d=t.dataset;
  if(d.copy!==undefined) return copy(d.copy);
  if(t.closest(".sheet")) return;
  if(d.go){ view=d.go; render(); window.scrollTo(0,0); return; }
  if(mode!=="admin" || !ME.admin) return;
  if(d.approve) return approve(d.approve,true,t);
  if(d.inf) return infDetail(d.inf);
  if(d.sale) return saleForm(S.sales.find(s=>s.id===d.sale));
  if(d.ship) return shipForm(S.ship.find(s=>s.id===d.ship));
  if(d.camp) return campForm(S.camp.find(c=>c.id===d.camp));
  if(d.chal) return chalForm(S.chal.find(c=>c.id===d.chal));
  if(d.payinf) return payForm(d.payinf);
  if(d.exp1) return exportOne(d.exp1);
  if(d.credit){ const [cid,iid]=d.credit.split(":"); const c=S.chal.find(x=>x.id===cid); t.disabled=true;
    save("cred",null,{infId:iid,chalId:cid,amount:Number(c.bonus),date:today(),note:"Bônus: "+c.title}).then(ok=>ok&&toast("Bônus creditado na carteira")); return; }
  if(d.delhist){ const [k,id]=d.delhist.split(":"); const cell=t.parentElement; cell.innerHTML=`<button class="btn sm danger" id="dh-y" type="button">Confirmar</button>`; $("#dh-y").onclick=()=>del(k,id).then(ok=>ok&&toast("Excluído")); return; }
  ({ "new-inf":()=>infForm(), "new-sale":()=>saleForm(), "import":importSheet, "new-pay":()=>payForm(), "new-camp":()=>campForm(), "new-chal":()=>chalForm(), "new-ship":()=>shipForm(), "exp-all":exportAll, "exp-sales":exportSales })[t.id]?.();
});

if(SUPABASE_URL.includes("SEU-PROJETO") || SUPABASE_KEY.includes("COLE-AQUI")){
  gate(`<h1>Falta configurar</h1><p>Abra o arquivo index.html e preencha SUPABASE_URL e SUPABASE_KEY com os dados do seu projeto no Supabase (Project Settings &gt; API).</p>`);
  return;
}
if(!window.supabase){ gate(`<p>Não foi possível carregar o sistema. Confira sua internet e recarregue a página.</p>`); return; }
sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
sb.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT"){ started=false; if(salesChannel){ sb.removeChannel(salesChannel); salesChannel=null; } Object.assign(ME,{admin:false,infId:null,email:""}); if(location.hash!=="#cadastro") renderLogin(); }
});
window.addEventListener("hashchange",()=>{ if(location.hash==="#cadastro") renderSignup(); else if(!$("#main")) start(); });
if(location.hash==="#cadastro") renderSignup(); else start();
})();
</script>
